    <h1>第2回 レーザーカッティング</h1><br>
    <div><h1> レーザーカットでモノづくり</h1></div><br>
    <div><h2>題名　思い出の襷</h2></div><br>
    この作品は私が高校時代に所属していた陸上部のユニフォームをモチーフに作りました。<br>
    <strong>なぜユニフォームなのに襷？</strong>と思いませんか？<br>
    この作品はアクセサリーを肩に位置するところにかけられるようにデザインしそれを襷に見立てているからです。<br>
